<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="" method="">
        <!--  form ฟอร์ม แบบป้อน -->
        <label for="">ชื่อ-นามสกุล</label>
        <input type="text" name="" id="" placeholder="John Doe">
        <br><br>
        <label for="">อายุ</label>
        <input type="number" name="" id="" placeholder="xx/xx/xxxx">
        <br><br>
        <label for="">อีเมล์</label>
        <input type="email" name="" id="" placeholder="exsameple@gmail.com">
        <br><br>
        <label for="">รหัสผ่าน</label>
        <input type="password" name="" id="" placeholder="password character at least 6">
        <button>Submit</button>
        <br><br>
        <label for="">ประวัติส่วนตัว</label>
        <textarea name="" id=""></textarea>
        <!-- แบบเลือก  -->
        <br><br>
        <label for="">เพศ</label>
        <input type="radio" name="sex" id="" value="1">👨🏻
        <input type="radio" name="sex" id="" value="2">👧🏻
        <input type="radio" name="sex" id="" value="3">🧑🏻‍❤️‍👩🏻
        <br><br>

        <label for="">ที่อยู่</label>
        <select name="" id="">
            <option value="1">กรุงเทพ</option>
            <option value="2">ชลบุรี</option>
            <option value="3">นครปฐม</option>
        </select>
        <br><br>

        <label for="">อาหารที่ชอบ</label>
        <input type="date" name="" id="" />
        <br /><br />

        <label for="">เวลาตกฟาก</label>
        <input type="time" name="" id="" />
        <br /><br />

        <label for="">วันเวลาเข้าทำงาน</label>
        <input type="datetime-local" name="" id="">

        <!-- เลือกไฟล์ (รูป, วีดีโอ, เอกสาร) -->
        <br /><br />
        <label for="">เลือกรูป</label>
        <input type="file" name="" id="" accept="image/*">
        <br /><br />

        <label for="">เลือกไฟล์ word, pdf</label>
        <input type="file" name="" id="" accept=".doc, .docx, .pdf">
        
        <!-- ปุ่ม  -->
        <br /><br />
        <input type="submit" value="OK">
        <input type="reset" value="Cancel">
    </form>

</body>

</html>
